<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Desafio Prático de QA - Avaliação da loja virtual do fornecedor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#145a5a"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>

  <!-- elementos decorativos: checks de teste -->
  <g clip-path="url(#card)" opacity="0.12" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1040" cy="90" r="120"/>
    <path d="M985 92 l38 38 l72 -78"/>
    <circle cx="1140" cy="300" r="70"/>
  </g>

  <!-- etiqueta -->
  <rect x="70" y="62" width="250" height="38" rx="19" fill="#2ec4b6" opacity="0.18"/>
  <text x="195" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#7ff0e4" letter-spacing="1">ANALISTA DE QA · CPB</text>

  <!-- título -->
  <text x="70" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Desafio Prático de QA</text>
  <text x="70" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cfe3ef">Avaliação da loja virtual do fornecedor antes do aceite da entrega</text>

  <!-- quatro frentes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f2742">
    <rect x="70"  y="262" width="190" height="44" rx="22" fill="#ffffff"/>
    <text x="165" y="290" text-anchor="middle">Carrinho</text>
    <rect x="276" y="262" width="210" height="44" rx="22" fill="#ffffff"/>
    <text x="381" y="290" text-anchor="middle">Catálogo e busca</text>
    <rect x="502" y="262" width="190" height="44" rx="22" fill="#ffffff"/>
    <text x="597" y="290" text-anchor="middle">API de conta</text>
    <rect x="708" y="262" width="230" height="44" rx="22" fill="#2ec4b6"/>
    <text x="823" y="290" text-anchor="middle">Compra ponta a ponta</text>
  </g>
</svg>
